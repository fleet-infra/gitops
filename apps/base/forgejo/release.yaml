apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: forgejo
  namespace: forgejo
spec:
  releaseName: forgejo
  interval: 1h
  chart:
    spec:
      chart: forgejo
      version: "16.2.2"
      sourceRef:
        kind: HelmRepository
        name: forgejo
        namespace: flux-system
  install:
    createNamespace: false
  values:
    gitea:
      config:
        database:
          DB_TYPE: sqlite3
        server:
          DOMAIN: forgejo.k3d.localhost
          ROOT_URL: https://forgejo.k3d.localhost
