apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vaultwarden
  namespace: vaultwarden
spec:
  interval: 1h
  chart:
    spec:
      chart: vaultwarden
      version: "0.35.1"
      sourceRef:
        kind: HelmRepository
        name: vaultwarden
        namespace: flux-system
  values:
    image:
      tag: latest
    storage:
      enabled: true
      size: 2Gi
    env:
      - name: SIGNUPS_ALLOWED
        value: "true"
