apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: homepage
  namespace: homepage
spec:
  interval: 1h
  chart:
    spec:
      chart: homepage
      version: "2.1.0"
      sourceRef:
        kind: HelmRepository
        name: homepage
        namespace: flux-system
  values:
    image:
      repository: ghcr.io/gethomepage/homepage
      tag: v1.2.0

    controller:
      strategy: RollingUpdate

    enableRbac: true
    serviceAccount:
      create: true
    kubernetes:
      mode: cluster

    service:
      main:
        ports:
          http:
            port: 3000

    ingress:
      main:
        enabled: false

    config:
      settingsString: |
        title: "Dashboard"
        headerStyle: boxed

      bookmarks:
        - Developer:
            - GitHub:
                - abbr: GH
                  href: https://github.com/

      services:
        - My First Group:
            - My First Service:
                href: http://localhost/
                description: Homepage is awesome
        - My Second Group:
            - My Second Service:
                href: http://localhost/
                description: Homepage is the best
        - My Third Group:
            - My Third Service:
                href: http://localhost/
                description: Homepage is 😎

      widgets:
        - resources:
            backend: resources
            expanded: true
            cpu: true
            memory: true
        - search:
            provider: duckduckgo
            target: _blank
        - kubernetes:
            cluster:
              show: true
              cpu: true
              memory: true
              showLabel: true
              label: "cluster"
            nodes:
              show: true
              cpu: true
              memory: true
              showLabel: true

    env:
      - name: TZ
        value: "Europe/Paris"
