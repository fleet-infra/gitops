apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: homepage
  namespace: homepage
spec:
  interval: 30m
  chart:
    spec:
      chart: homepage
      version: "2.1.0"
      sourceRef:
        kind: HelmRepository
        name: homepage
        namespace: flux-system
  install:
    createNamespace: false
  values:
    image:
      repository: ghcr.io/gethomepage/homepage
      tag: v1.2.0
      pullPolicy: IfNotPresent

    env:
      TZ: Europe/Paris
      HOMEPAGE_ALLOWED_HOSTS: homepage.tail994e59.ts.net

    service:
      main:
        type: ClusterIP
        annotations:
          tailscale.com/expose: "true"
          tailscale.com/hostname: "homepage"
          tailscale.com/tls-certificate-name: "homepage-tls"
        ports:
          http:
            port: 80
            targetPort: 3000

    ingress:
      main:
        enabled: false
