apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: homepage
  namespace: homepage
spec:
  interval: 1h
  chart:
    spec:
      chart: homepage
      version: "2.1.0"
      sourceRef:
        kind: HelmRepository
        name: homepage
        namespace: flux-system
  values:
    image:
      repository: ghcr.io/gethomepage/homepage
      tag: v1.12.3

    controller:
      strategy: RollingUpdate

    enableRbac: true
    serviceAccount:
      create: true
    kubernetes:
      mode: cluster

    service:
      main:
        ports:
          http:
            port: 3000

    ingress:
      main:
        enabled: false

    config:
      settingsString: |
        title: Pierre's cluster
        headerStyle: clean
        theme: dark
        color: slate
        target: _blank
        disableIndexing: true
        background:
          image: https://images.unsplash.com/photo-1502790671504-542ad42d5189?auto=format&fit=crop&w=2560&q=80
          blur: sm
          saturate: 50
          brightness: 50
          opacity: 50

      bookmarks:
        - Dev:
            - GitHub:
                - icon: github
                  href: https://github.com
            - GitLab:
                - icon: gitlab
                  href: https://gitlab.com
        - Social:
            - Reddit:
                - icon: reddit
                  href: https://reddit.com
        - Entertainment:
            - YouTube:
                - icon: youtube
                  href: https://youtube.com
            - Twitch:
                - icon: twitch
                  href: https://twitch.tv

      services:
        - Infrastructure:
            - Forgejo:
                icon: forgejo
                href: https://code.${tailnet_domain}
                siteMonitor: https://code.${tailnet_domain}
            - Flux UI:
                icon: flux-cd
                href: http://flux.${tailnet_domain}
                siteMonitor: http://flux.${tailnet_domain}
        - Network & Security:
            - Traefik Proxy:
                icon: traefik-proxy
                href: https://traefik.${tailnet_domain}
                siteMonitor: https://traefik.${tailnet_domain}
            - Tailscale:
                icon: tailscale
                href: https://login.tailscale.com/admin/machines
            - AdGuard Home:
                icon: adguard-home
                href: https://dns.${tailnet_domain}
            - Vaultwarden:
                icon: vaultwarden
                href: https://vault.${tailnet_domain}
        - Monitoring:
            - Prometheus:
                icon: prometheus
                href: http://localhost
                siteMonitor: https://localhost
            - Uptime Kuma:
                icon: uptime-kuma
                href: https://status.${tailnet_domain}
        - Media & Entertainment:
            - Jellyfin:
                icon: jellyfin
                href: https://jellyfin.${tailnet_domain}
            - Immich:
                icon: immich
                href: https://photos.${tailnet_domain}
        - Apps & Cloud:
            - Seafile:
                icon: seafile
                href: https://cloud.${tailnet_domain}
                siteMonitor: https://cloud.${tailnet_domain}
            - Paperless-ngx:
                icon: paperless-ngx
                href: https://paperless.${tailnet_domain}
            - Vikunja:
                icon: vikunja
                href: https://tasks.${tailnet_domain}
            - Mealie:
                icon: mealie
                href: https://recipes.${tailnet_domain}
        - Tools & Utilities:
            - Stirling-PDF:
                icon: stirling-pdf
                href: https://pdf.${tailnet_domain}
            - Excalidraw:
                icon: excalidraw
                href: https://draw.${tailnet_domain}

      widgets:
        - greeting:
            text_size: 2xl
            text: Welcome to Pierre's cluster
        - resources:
            cpu: true
            memory: true
        - openmeteo:
            label: Rouen
            latitude: 49.433331
            longitude: 1.08333
            timezone: Europe/Paris
            units: metric
            cache: 5
            format:
              maximumFractionDigits: 1

    env:
      - name: TZ
        value: "Europe/Paris"
