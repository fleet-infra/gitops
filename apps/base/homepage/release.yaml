apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: homepage
  namespace: homepage
spec:
  interval: 30m
  chart:
    spec:
      chart: homepage
      version: "*"
      sourceRef:
        kind: HelmRepository
        name: homepage
        namespace: flux-system
  install:
    createNamespace: false
  values:
    image:
      repository: ghcr.io/gethomepage/homepage
      tag: latest
      pullPolicy: Always

    env:
      TZ: Europe/Paris

    service:
      main:
        type: ClusterIP
        annotations:
          tailscale.com/expose: "true"
          tailscale.com/hostname: "homepage"
        ports:
          http:
            port: 80
            targetPort: 3000

    ingress:
      main:
        enabled: false
