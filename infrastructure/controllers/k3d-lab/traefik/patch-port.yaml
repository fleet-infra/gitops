apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: flux-system
spec:
  values:
    api:
      insecure: true
    ports:
      traefik:
        expose:
          default: true
      web:
        hostPort: 80
      websecure:
        hostPort: 443
    service:
      type: ClusterIP
